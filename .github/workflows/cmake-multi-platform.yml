name: CMake on multiple platforms

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            c_compiler: gcc
            cpp_compiler: g++
            build_type: Release
          - os: ubuntu-24.04
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Release
          - os: windows-2022
            build_type: Release

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-all-dev

      - name: Install Boost dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) {
            throw "The Windows runner did not provide VCPKG_INSTALLATION_ROOT."
          }
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install `
            boost-date-time boost-json boost-url boost-filesystem `
            boost-asio boost-beast boost-format boost-process boost-uuid `
            --triplet x64-windows
          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg failed to install Boost dependencies."
          }

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: >
          cmake -B build -S .
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          cmake -B build -S .
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Install Chromium for system tests (Linux)
        if: runner.os == 'Linux'
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: ctest --test-dir build --build-config ${{ matrix.build_type }} --verbose

      - name: Test portable C++ suites (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "$env:GITHUB_WORKSPACE\build\bin\${{ matrix.build_type }};$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin;$env:PATH"
          ctest --test-dir build --build-config ${{ matrix.build_type }} `
            --output-on-failure --tests-regex "^(manager_tests|model_tests)$"
