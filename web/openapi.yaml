openapi: 3.0.3
info:
  title: TUPAL API
  version: 1.0.0
  description: REST interface for result service daemon


paths:
  /rest/competition/:
    get:
      summary: List Competitions
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Competition'

    post:
      summary: Create a Competition
      requestBody:
        description: Competition data
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Competition'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Competition'

  /rest/competition/{compId}:
    parameters:
      - name: compId
        in: path
        required: true
        schema:
          type: string
          description: |
            Unique identifier of existing Competition.
            The identifier shall be determined by the client.
          example: 'comp-1'

    get:
      summary: Get a cCompetition
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Competition"

    put:
      summary: Update a competition
      requestBody:
        description: Content for the replacing Competition
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Competition'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Competition'

    delete:
      summary: Remove a competition
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetitionId'

  /rest/competition/{compId}/start_group/:
    parameters:
      - name: compId
        in: path
        required: true
        schema:
          type: string
          description: Unique identifier of existing Competition
          example: 'comp-1'

    get:
      summary: Get a list of Start Groups of a specific Competition
      responses:
        '200':
          description: Ok
          content: 
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StartGroup'

    post:
      summary: Create a new Start Group to a specific competition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartGroup'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartGroup'

  /rest/competition/{compId}/start_group/{sgId}:
    parameters:
      - name: compId
        in: path
        required: true
        schema:
          type: string
          description: Unique identifier of existing Competition
          example: 'comp-1'
      - name: sgId
        in: path
        required: true
        schema:
          type: string
          description: !
            Unique identifier of existing Start Group.
            The identifier shall be determined by the client.
          example: 'sg-1'

    get:
      summary: Get a Start Group within a specific competition
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartGroup'

    put:
      summary: Update on existing Start Group within a specific Competition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartGroup'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartGroup'

    delete:
      summary: Remove a Start Group
      responses:
        '200':
          description: Removed
          content:
            application/json: 
              schema:
                $ref: '#/components/schemas/EmbeddedEntityId'

  /rest/competition/{compId}/competition_class/:
    parameters:
      - name: compId
        in: path
        required: true
        schema:
          type: string
          description: Unique identifier of existing Competition
          example: 'comp-1'

    get:
      summary: Get list of Competition Classes within a Competition
      responses:
        '200':
          description: Ok
          content:
            application/json: 
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompetitionClass'

    post:
      summary: Create a new Competition Class within a Competition
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompetitionClass'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetitionClass'

  /rest/competition/{compId}/competition_class/{ccId}:
    parameters:
      - name: compId
        in: path
        required: true
        schema:
          type: string
          description: Unique identifier of existing Competition
          example: 'comp-1'
      - name: ccId
        in: path
        required: true
        schema:
          type: string
          description: Unique identifier of existing Competition Class
          example: 'cc-1'

    get:
      summary: Get a Competition Class
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetitionClass'

    put:
      summary: Update an existing Competition Class
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompetitionClass'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetitionClass'

    delete:
      summary: Remove an existing Competition Class
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddedEntityId'

  /rest/competition/{compId}/competitor/:
    parameters:
      - name: compId
        in: path
        required: true
        schema:
          type: string
          description: Unique identifier of existing Competitor
          example: 'ctor-1'

    get:
      summary: Get list of Competitor within a Competition
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Competitor'

    post:
      summary: Create a new Competitor within a Competition
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Competitor'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Competitor'

  /rest/competition/{compId}/competitor/{ctorId}:
    parameters:
      - name: compId
        in: path
        required: true
        schema:
          type: string
          description: Unique identifier of existing Competition
          example: 'comp-1'
      - name: ctorId
        in: path
        required: true
        schema:
          type: string
          description: Unique identifier of existing Competitor
          example: 'ctor-1'

    get:
      summary: Get a Competitor
      responses:
        '200':
          description: Ok
          content:
            application/json: 
              schema:
                $ref: '#/components/schemas/Competitor'

    put:
      summary: Update an existing Competitor
      requestBody:
        required: true
        content:
          application/json: 
            schema:
              $ref: '#/components/schemas/Competitor'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Competitor'

    delete:
      summary: Remove an existing Competitor
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddedEntityId'

  /rest/competition/{compId}/finish_time_entry/:
    parameters:
      - name: compId
        in: path
        required: true
        schema:
          type: string
          description: Unique identifier of the Competition
          example: 'comp-1'

    get:
      summary: List finish-line time entries for a Competition
      responses:
        '200':
          description: Finish-time entries ordered by finish time
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FinishTimeEntry'

    post:
      summary: Record a finish-line time entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinishTimeEntryCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinishTimeEntry'

  /rest/competition/{compId}/finish_time_entry/{entryId}:
    parameters:
      - name: compId
        in: path
        required: true
        schema:
          type: string
          description: Unique identifier of the Competition
          example: 'comp-1'
      - name: entryId
        in: path
        required: true
        schema:
          type: string
          description: Unique identifier of the finish-time entry
          example: 'time-1'

    get:
      summary: Get a finish-time entry
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinishTimeEntry'

    put:
      summary: Update a finish-time entry
      description: Requires id. Omitted finish_time and status fields retain their current values.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinishTimeEntryUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinishTimeEntry'

    delete:
      summary: Remove a finish-time entry
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddedEntityId'

  /rest/competition/{compId}/finish_bib_entry/:
    parameters:
      - name: compId
        in: path
        required: true
        schema:
          type: string
          description: Unique identifier of the Competition
          example: 'comp-1'

    get:
      summary: List finish-line bib entries for a Competition
      responses:
        '200':
          description: Finish-bib entries ordered by sequence number
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FinishBibEntry'

    post:
      summary: Record a finish-line bib entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinishBibEntryCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinishBibEntry'

  /rest/competition/{compId}/finish_bib_entry/{entryId}:
    parameters:
      - name: compId
        in: path
        required: true
        schema:
          type: string
          description: Unique identifier of the Competition
          example: 'comp-1'
      - name: entryId
        in: path
        required: true
        schema:
          type: string
          description: Unique identifier of the finish-bib entry
          example: 'bib-1'

    get:
      summary: Get a finish-bib entry
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinishBibEntry'

    put:
      summary: Update a finish-bib entry
      description: Requires id. Omitted fields retain their current values; bib and confirmed_time_entry_id may be set to null.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinishBibEntryUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinishBibEntry'

    delete:
      summary: Remove a finish-bib entry
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddedEntityId'

components:
  schemas:
    Competition:
      type: object
      properties:
        id:
          type: string
          description: Unique id of the Competition
          example: 'comp-1'
        date:
          type: string
          format: date
          description: Date of event
          example: '2025-12-31'
        title:
          type: string
          description: Brief name of the Competition
          example: 'Pirkkalan Hölkkä'

    StartGroup:
      type: object
      properties:
        id:
          type: string
          description: Unique id of the Start Group
          example: 'sg-1'
        title:
          type: string
          description: Brief name of the Start Group
          example: 'Lasten lähtö'
        first_start_time:
          type: string
          format: date-time
          description: First start time within this Start Group
          example: '2025-12-31T18:30:00'
        first_bib:
          type: integer
          minimum: 0
          example: 501
        start_interval:
          type: string
          description: ISO 8601 duration between consecutive bib start times; zero means a mass start, and omitted values default to zero
          example: 'PT30S'

    CompetitionClass:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the Competition Class
          example: 'cc-1'
        title:
          type: string
          description: Brief name of a Competition Class
          example: 'M18'
        start_group_id:
          type: string
          description: |
            Identifier of the Start Groug to which this Competition Class belongs to
          example: 'sg-1'

    Competitor:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the Competitor
          example: 'ctor-1'
        comp_class_id:
          type: string
          description: Identifier of the Competition Class this Competitor is enrolled to
          example: 'cc-1'
        bib:
          type: integer
          minimum: 0
          description: Competitor's bib.
        start_time_offset:
          type: string
          format: duration
          pattern: 'PT[0-9]+\.[0-9]{3}S'
          description: Start time offset relative to Start Group's first start time.
          example: 'PT0.000S'
        finish_time:
          type: string
          format: date-time
          description: Time in the finish line.
          example: '2025-12-31T18:30:00.000Z'
        status:
          type: integer
          minimum: 0
          maximum: 3
          description: Competitor's status, 0-n/a, 1-dns, 2-dnf, 3-dsq
          example: 0
        name:
          type: string
          description: Competitor's name, preferrable family name first, and then given name
          example: 'Edison Thomas'

    FinishTimeEntry:
      type: object
      required:
        - id
        - comp_id
        - finish_time
        - status
      properties:
        id:
          type: string
          description: Unique identifier of the finish-time entry
          example: 'time-1'
        comp_id:
          type: string
          description: Identifier of the Competition
          example: 'comp-1'
        finish_time:
          type: string
          format: date-time
          description: Recorded finish-line time
          example: '2025-12-31T18:30:00.000Z'
        status:
          $ref: '#/components/schemas/FinishEntryStatus'

    FinishTimeEntryCreate:
      type: object
      required:
        - finish_time
      properties:
        id:
          type: string
          nullable: true
          description: Optional client-generated identifier; omitted or null generates an identifier
          example: 'time-1'
        finish_time:
          type: string
          format: date-time
          description: Recorded finish-line time
          example: '2025-12-31T18:30:00.000Z'
        status:
          $ref: '#/components/schemas/FinishEntryStatus'

    FinishTimeEntryUpdate:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: Identifier of the finish-time entry to update
          example: 'time-1'
        finish_time:
          type: string
          format: date-time
          description: Replacement finish-line time
          example: '2025-12-31T18:30:00.000Z'
        status:
          $ref: '#/components/schemas/FinishEntryStatus'

    FinishBibEntry:
      type: object
      required:
        - id
        - comp_id
        - sequence_no
        - bib
        - status
        - confirmed_time_entry_id
      properties:
        id:
          type: string
          description: Unique identifier of the finish-bib entry
          example: 'bib-1'
        comp_id:
          type: string
          description: Identifier of the Competition
          example: 'comp-1'
        sequence_no:
          type: integer
          minimum: 0
          description: Order in which this bib was recorded
          example: 1
        bib:
          type: integer
          nullable: true
          description: Read bib number, or null if not identified
          example: 42
        status:
          $ref: '#/components/schemas/FinishEntryStatus'
        confirmed_time_entry_id:
          type: string
          nullable: true
          description: Linked finish-time entry, or null if not confirmed
          example: 'time-1'

    FinishBibEntryCreate:
      type: object
      required:
        - sequence_no
      properties:
        id:
          type: string
          nullable: true
          description: Optional client-generated identifier; omitted or null generates an identifier
          example: 'bib-1'
        sequence_no:
          type: integer
          minimum: 0
          description: Order in which this bib was recorded
          example: 1
        bib:
          type: integer
          nullable: true
          description: Read bib number, or null if not identified
          example: 42
        status:
          $ref: '#/components/schemas/FinishEntryStatus'
        confirmed_time_entry_id:
          type: string
          nullable: true
          description: Linked finish-time entry, or null if not confirmed
          example: 'time-1'

    FinishBibEntryUpdate:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: Identifier of the finish-bib entry to update
          example: 'bib-1'
        sequence_no:
          type: integer
          minimum: 0
          description: Replacement order number
          example: 2
        bib:
          type: integer
          nullable: true
          description: Replacement read bib number, or null to clear it
          example: 43
        status:
          $ref: '#/components/schemas/FinishEntryStatus'
        confirmed_time_entry_id:
          type: string
          nullable: true
          description: Linked finish-time entry, or null to clear the link
          example: 'time-1'

    FinishEntryStatus:
      type: integer
      minimum: 0
      maximum: 3
      description: 'Finish observation status: 0-confirmed, 1-uncertain, 2-incorrect, 3-missing'
      example: 0

    CompetitionId:
      type: object
      properties:
        id:
          type: string
          description: Identity of a Competition
          example: 'comp-1'

    EmbeddedEntityId:
      type: object
      properties:
        id:
          type: string
          description: Identity of embedded entity.
          example: 'sg-1'
        comp_id:
          type: string
          description: Identity of embedding Competition
          example: 'comp-1'
